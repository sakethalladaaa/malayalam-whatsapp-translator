name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.141.1 pydantic==2.13.5 httpx==0.28.1 pytest==9.1.1

      - name: Run backend tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest backend/tests -q

      - name: Run Phase 7 preprocessing tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest phase7/tests/test_preprocessing.py -q

      - name: Check extension JavaScript
        run: node --check extension/src/content.js
